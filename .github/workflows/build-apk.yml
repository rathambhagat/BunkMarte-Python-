name: Build BunkMarte APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet CLI
        run: pip install flet

      - name: Build Android APK
        # yes pipe bypasses the SDK download prompt
        # split-per-abi drastically reduces the final APK size
        # module-name tells Flet exactly which file to compile
        run: yes | flet build apk --project "BunkMarte" --module-name app.py --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunkmarte-apk
          path: build/apk/*.apk